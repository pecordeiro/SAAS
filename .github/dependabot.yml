# Fase 7: atualizações de dependências (segurança primeiro). Cada PR roda o CI completo
# (pip-audit + testes em PostgreSQL e SQLite) antes do merge.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    labels: ["dependências"]
    groups:
      flask:
        patterns: ["Flask*", "Werkzeug", "WTForms", "flask-*"]
      banco:
        patterns: ["SQLAlchemy", "alembic", "psycopg*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels: ["dependências"]
