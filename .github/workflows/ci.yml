name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: controle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Instalar dependências
        run: pip install -r requirements-dev.txt
      - name: Banco para o ciclo de migrations
        run: psql -c "CREATE DATABASE controle_ci"
      - name: Migrations no PostgreSQL 16 (upgrade → downgrade base → upgrade, sem drift)
        env:
          APP_ENV: development
          FLASK_APP: run.py
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/controle_ci
        run: |
          flask db upgrade
          flask db check
          flask db downgrade base
          flask db upgrade
          flask db check
      - name: Migrations no SQLite (atalho de desenvolvimento)
        env:
          APP_ENV: development
          FLASK_APP: run.py
          DATABASE_URL: sqlite:////tmp/ci.db
        run: |
          flask db upgrade
          flask db check
          flask db downgrade base
          flask db upgrade
      - name: Testes no PostgreSQL 16 (inclui RLS com papel não superusuário)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/controle_test
        run: python -m pytest -q --cov=app --cov-report=term
      - name: Testes no SQLite
        run: python -m pytest -q
