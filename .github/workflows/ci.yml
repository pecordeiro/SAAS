name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    # Fase 7: dependências com vulnerabilidade conhecida quebram o CI. Exceções só com
    # justificativa em docs/plano/seguranca.md (--ignore-vuln ID).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit (versão fixada)
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit -r requirements-dev.txt

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: controle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Instalar dependências
        run: pip install -r requirements-dev.txt
      - name: age (testes do backup criptografado; Etapa H)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age
      - name: Assets e render.yaml em dia
        run: |
          python scripts/build_assets.py --check
          python scripts/gen_render_yaml.py --check
      - name: Banco para o ciclo de migrations
        run: psql -c "CREATE DATABASE controle_ci"
      - name: Migrations no PostgreSQL 16 (upgrade → downgrade base → upgrade, sem drift)
        env:
          APP_ENV: development
          FLASK_APP: run.py
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/controle_ci
        run: |
          flask db upgrade
          flask db check
          flask db downgrade base
          flask db upgrade
          flask db check
      - name: Migrations no SQLite (atalho de desenvolvimento)
        env:
          APP_ENV: development
          FLASK_APP: run.py
          DATABASE_URL: sqlite:////tmp/ci.db
        run: |
          flask db upgrade
          flask db check
          flask db downgrade base
          flask db upgrade
      - name: Testes no PostgreSQL 16 (inclui RLS com papel não superusuário)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/controle_test
        run: python -m pytest -q --cov=app --cov-report=term
      - name: Testes no SQLite
        run: python -m pytest -q

  docker:
    # Etapa H: a imagem de produção precisa construir, rodar sem root e subir o gunicorn.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir a imagem
        run: docker build -t controle-producao .
      - name: Usuário sem privilégios e assets construídos
        run: |
          test "$(docker run --rm controle-producao id -u)" != "0"
          docker run --rm controle-producao test -f app/static/dist/manifest.json
          docker run --rm controle-producao sh -c 'test ! -f .env && test ! -d tests'
      - name: Sobe e responde em /saude (sem banco)
        run: |
          docker run -d --name web -p 10000:10000 \
            -e APP_ENV=staging -e SECRET_KEY=$(python3 -c "import secrets; print(secrets.token_hex(32))") \
            -e DATABASE_URL=postgresql://u:p@127.0.0.1:5432/x -e APP_BASE_URL=https://staging.exemplo.com.br \
            -e REDIS_URL=redis://127.0.0.1:6379/0 controle-producao
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:10000/saude && break; sleep 1; done
          curl -fsS http://127.0.0.1:10000/saude | python3 -c "import sys, json; assert json.load(sys.stdin) == {'status': 'ok'}"
          docker logs web
