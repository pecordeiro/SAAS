name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Instalar dependências
        run: pip install -r requirements-dev.txt
      - name: Migrations em banco vazio
        env:
          APP_ENV: development
          FLASK_APP: run.py
          DATABASE_URL: sqlite:////tmp/ci.db
        run: |
          flask db upgrade
          flask db check
      - name: Testes
        run: python -m pytest -q --cov=app --cov-report=term
