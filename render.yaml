# GERADO por scripts/gen_render_yaml.py — NÃO edite à mão (o CI confere). Veja docs/plano/lancamento.md.
# Valide antes de criar o Blueprint:  render blueprints validate render.yaml
# Segredos: todos `sync: false` — o Render pergunta o valor uma única vez, no serviço web.
services:
- type: web
  name: controle-web
  runtime: docker
  region: virginia
  plan: starter
  dockerfilePath: ./Dockerfile
  dockerContext: .
  branch: main
  autoDeploy: false
  healthCheckPath: /saude
  preDeployCommand: sh -c "flask config-check --online && flask db upgrade && flask seed-plans"
  envVars:
  - key: APP_ENV
    value: production
  - key: TRUSTED_PROXY_COUNT
    value: '1'
  - key: LOG_JSON
    value: 'true'
  - key: LOG_LEVEL
    value: INFO
  - key: RLS_ENABLED
    value: 'true'
  - key: FEATURE_PUBLIC_API
    value: 'false'
  - key: READ_ONLY_ENFORCED
    value: 'true'
  - key: BILLING_PROVIDER
    value: asaas
  - key: ASAAS_BASE_URL
    value: https://api.asaas.com/v3
  - key: MAIL_BACKEND
    value: resend
  - key: STORAGE_BACKEND
    value: s3
  - key: STORAGE_S3_REGION
    value: auto
  - key: STORAGE_S3_ADDRESSING
    value: path
  - key: SENTRY_TRACES_SAMPLE_RATE
    value: '0'
  - key: DATABASE_URL
    fromDatabase:
      name: controle-db
      property: connectionString
  - key: REDIS_URL
    fromService:
      type: keyvalue
      name: controle-redis
      property: connectionString
  - key: SECRET_KEY
    sync: false
  - key: MFA_ENCRYPTION_KEY
    sync: false
  - key: APP_BASE_URL
    sync: false
  - key: CONTACT_EMAIL
    sync: false
  - key: MAIL_FROM
    sync: false
  - key: RESEND_API_KEY
    sync: false
  - key: ASAAS_API_KEY
    sync: false
  - key: ASAAS_WEBHOOK_TOKEN
    sync: false
  - key: STORAGE_S3_ENDPOINT
    sync: false
  - key: STORAGE_S3_BUCKET
    sync: false
  - key: STORAGE_S3_ACCESS_KEY_ID
    sync: false
  - key: STORAGE_S3_SECRET_ACCESS_KEY
    sync: false
  - key: SENTRY_DSN
    sync: false
  - key: STAFF_NOTIFY_EMAIL
    sync: false
