- type: cron
  name: controle-backup
  runtime: docker
  region: virginia
  plan: starter
  dockerfilePath: ./docker/backup/Dockerfile
  dockerContext: .
  branch: main
  autoDeploy: false
  schedule: 0 7 * * *
  envVars:
  - key: DATABASE_URL
    fromDatabase:
      name: controle-db
      property: connectionString
  - key: BACKUP_RETENTION_DAYS
    value: '30'
  - key: BACKUP_PREFIX
    value: db/
  - key: PHOTOS_SRC_BUCKET
    fromService:
      type: web
      name: controle-web
      envVarKey: STORAGE_S3_BUCKET
  - key: BACKUP_S3_ENDPOINT
    sync: false
  - key: BACKUP_S3_BUCKET
    sync: false
  - key: BACKUP_S3_ACCESS_KEY_ID
    sync: false
  - key: BACKUP_S3_SECRET_ACCESS_KEY
    sync: false
  - key: BACKUP_AGE_RECIPIENT
    sync: false
  - key: BACKUP_SIGN_KEY
    sync: false
