  - key: CONTACT_EMAIL
    fromService:
      type: web
      name: controle-web
      envVarKey: CONTACT_EMAIL
  - key: MAIL_FROM
    fromService:
      type: web
      name: controle-web
      envVarKey: MAIL_FROM
  - key: RESEND_API_KEY
    fromService:
      type: web
      name: controle-web
      envVarKey: RESEND_API_KEY
  - key: ASAAS_API_KEY
    fromService:
      type: web
      name: controle-web
      envVarKey: ASAAS_API_KEY
  - key: ASAAS_WEBHOOK_TOKEN
    fromService:
      type: web
      name: controle-web
      envVarKey: ASAAS_WEBHOOK_TOKEN
  - key: STORAGE_S3_ENDPOINT
    fromService:
      type: web
      name: controle-web
      envVarKey: STORAGE_S3_ENDPOINT
  - key: STORAGE_S3_BUCKET
    fromService:
      type: web
      name: controle-web
      envVarKey: STORAGE_S3_BUCKET
  - key: STORAGE_S3_ACCESS_KEY_ID
    fromService:
      type: web
      name: controle-web
      envVarKey: STORAGE_S3_ACCESS_KEY_ID
  - key: STORAGE_S3_SECRET_ACCESS_KEY
    fromService:
      type: web
      name: controle-web
      envVarKey: STORAGE_S3_SECRET_ACCESS_KEY
  - key: SENTRY_DSN
    fromService:
      type: web
      name: controle-web
      envVarKey: SENTRY_DSN
  - key: STAFF_NOTIFY_EMAIL
    fromService:
      type: web
      name: controle-web
      envVarKey: STAFF_NOTIFY_EMAIL
  - key: WORKER_INTERVAL_SECONDS
    value: '30'
