  - key: STORAGE_S3_ADDRESSING
    value: path
  - key: SENTRY_TRACES_SAMPLE_RATE
    value: '0'
  - key: DATABASE_URL
    fromDatabase:
      name: controle-db
      property: connectionString
  - key: REDIS_URL
    fromService:
      type: keyvalue
      name: controle-redis
      property: connectionString
  - key: SECRET_KEY
    fromService:
      type: web
      name: controle-web
      envVarKey: SECRET_KEY
  - key: MFA_ENCRYPTION_KEY
    fromService:
      type: web
