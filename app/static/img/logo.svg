<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-labelledby="t">
  <title id="t">Controle de Produção</title>
  <!-- Símbolo "Prumo": bloco grafite com três etapas; a última, em amarelo sinalização, é a etapa em andamento.
       Grade de 32 com barras de 4 unidades: a 16 px cada barra tem 2 px e cada vão 3 px. -->
  <rect width="32" height="32" rx="6" fill="#151A1F"/>
  <rect x="6" y="7" width="20" height="4" fill="#FFFFFF"/>
  <rect x="6" y="14" width="14" height="4" fill="#FFFFFF"/>
  <rect x="6" y="21" width="8" height="4" fill="#F2B705"/>
</svg>
