{% extends "emails/_base.html" %}
{% block body %}
  <p>Olá, {{ name }}.</p>
  <p>A senha da sua conta foi trocada e as outras sessões foram encerradas.<br>
  Se não foi você, peça uma nova senha agora:</p>
  <p><a href="{{ reset_url }}">Pedir nova senha</a></p>
  <p><small>Se o botão não abrir, copie o endereço: {{ reset_url }}</small></p>
{% endblock %}
