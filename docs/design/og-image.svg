<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t d">
  <title id="t">Controle de Produção</title>
  <desc id="d">Saiba onde cada lote está: unidades concluídas, horas que faltam e prazo em dias úteis.</desc>
  <!-- Texto em <text> vetorial (não rasterizado). Na Fase 2, converter para PNG 1200x630 com as fontes
       Barlow Semi Condensed e IBM Plex Sans instaladas; cores somente da paleta (tema escuro + acento). -->
  <rect width="1200" height="630" fill="#0E1215"/>
  <rect x="0" y="0" width="1200" height="8" fill="#F2B705"/>

  <!-- Símbolo -->
  <g transform="translate(80 96) scale(2.5)">
    <rect width="32" height="32" rx="6" fill="#151A1F"/>
    <rect width="32" height="32" rx="6" fill="none" stroke="#2C353D" stroke-width="0.8"/>
    <rect x="6" y="7" width="20" height="4" fill="#FFFFFF"/>
    <rect x="6" y="14" width="14" height="4" fill="#FFFFFF"/>
    <rect x="6" y="21" width="8" height="4" fill="#F2B705"/>
  </g>
  <text x="184" y="148" fill="#E7EBEE" font-family="'Barlow Semi Condensed', 'IBM Plex Sans', Arial, sans-serif" font-size="36" font-weight="600">Controle de Produção</text>

  <text fill="#E7EBEE" font-family="'Barlow Semi Condensed', 'IBM Plex Sans', Arial, sans-serif" font-size="64" font-weight="700">
    <tspan x="80" y="290">Saiba onde cada</tspan>
    <tspan x="80" y="362">lote está.</tspan>
  </text>
  <text fill="#A2ADB7" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="26">
    <tspan x="80" y="430">Unidades concluídas, horas que faltam</tspan>
    <tspan x="80" y="466">e prazo em dias úteis, do celular ao escritório.</tspan>
  </text>
  <text x="80" y="560" fill="#5BBBD1" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="24" font-weight="600">Teste grátis por 14 dias</text>

  <!-- Painel de prova -->
  <g transform="translate(700 120)">
    <rect width="420" height="400" rx="10" fill="#161B20" stroke="#2C353D" stroke-width="2"/>
    <text x="32" y="56" fill="#A2ADB7" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="18">Lote 2026-014 · 10 equipamentos</text>

    <text x="32" y="112" fill="#A2ADB7" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="0.6">PROGRESSO</text>
    <text x="32" y="178" fill="#E7EBEE" font-family="'Barlow Semi Condensed', Arial, sans-serif" font-size="72" font-weight="700">56%</text>
    <rect x="32" y="200" width="356" height="12" rx="6" fill="#2C353D"/>
    <rect x="32" y="200" width="199" height="12" rx="6" fill="#5BBBD1"/>

    <line x1="32" y1="244" x2="388" y2="244" stroke="#2C353D" stroke-width="2"/>

    <text x="32" y="284" fill="#A2ADB7" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="0.6">FALTAM</text>
    <text x="32" y="336" fill="#E7EBEE" font-family="'Barlow Semi Condensed', Arial, sans-serif" font-size="48" font-weight="700">100 h</text>
    <text x="32" y="368" fill="#A2ADB7" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="16">de trabalho</text>

    <text x="220" y="284" fill="#A2ADB7" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="0.6">PRAZO</text>
    <text x="220" y="336" fill="#E7EBEE" font-family="'Barlow Semi Condensed', Arial, sans-serif" font-size="48" font-weight="700">4,2</text>
    <text x="220" y="368" fill="#5CC985" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="16" font-weight="600">dias úteis · no prazo</text>
  </g>
</svg>
