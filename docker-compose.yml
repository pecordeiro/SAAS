# Serviços de apoio para desenvolvimento e testes (o app roda fora do Docker: python run.py).
#   docker compose up -d
#   DATABASE_URL=postgresql+psycopg://controle:controle@localhost:5432/controle
#   TEST_DATABASE_URL=postgresql+psycopg://controle:controle@localhost:5432/controle_test
#   RATELIMIT_STORAGE_URI=redis://localhost:6379/0
# Senhas daqui são SÓ locais. O usuário "controle" é superusuário do container: para ele o
# RLS não vale (os testes de RLS criam um papel comum próprio). Ver ADR-0003.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: controle
      POSTGRES_PASSWORD: controle
      POSTGRES_DB: controle
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U controle -d controle"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
